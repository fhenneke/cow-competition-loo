[project]
name = "loo"
version = "0.1.0"
description = "Leave-one-out counterfactual analysis of the CoW Protocol solver competition"
requires-python = ">=3.11"
dependencies = [
    "psycopg2-binary>=2.9",
    "pandas>=2.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.12",
    "pyright[nodejs]>=1.1",
    "pandas-stubs>=2.0",
    "types-psycopg2>=2.9",
]
notebook = ["jupyterlab>=4.0", "matplotlib>=3.8"]

[project.scripts]
loo = "loo.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["loo"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.pyright]
typeCheckingMode = "strict"
include = ["loo", "tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint.pycodestyle]
# E501 fires past 120 only: docstring anchors and report lines are allowed to run long,
# while `line-length = 100` above stays the target for code.
max-line-length = 120

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # bugbear
    "SIM", # simplify
    "RUF", # ruff-specific
]
# `×`, `−` and `–` in docstrings and report strings are deliberate typography — the
# rendered write-up uses them (e.g. "counterfactual − actual") and they must not be
# "fixed" to ASCII lookalikes.
ignore = ["RUF001", "RUF002", "RUF003"]
