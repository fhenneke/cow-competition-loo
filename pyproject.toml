[project]
name = "loo"
version = "0.1.0"
description = "Leave-one-out counterfactual analysis of the CoW Protocol solver competition"
requires-python = ">=3.11"
dependencies = [
    "psycopg2-binary>=2.9",
    "pandas>=2.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
loo = "loo.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["loo"]

[tool.pytest.ini_options]
testpaths = ["tests"]
